spring:
  config:
    import: optional:file:.env[.properties]

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  catalog:
    base-url: ${MS01_URL:http://localhost:8080}
    service-key: ${MS_SERVICE_KEY:${MS_SERVICE_TOKEN:}}
    connect-timeout-ms: ${CATALOG_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${CATALOG_READ_TIMEOUT_MS:2000}
  alerts:
    types:
      base-url: ${MS06_URL:http://localhost:8080}
      path: ${MS06_ALERT_TYPES_PATH:/api/v1/tipos-alerta}
      service-key: ${MS_SERVICE_KEY:${MS_SERVICE_TOKEN:}}
      connect-timeout-ms: ${MS06_CONNECT_TIMEOUT_MS:2000}
      read-timeout-ms: ${MS06_READ_TIMEOUT_MS:2000}
      sync-ms: ${MS06_SYNC_MS:60000}
      sync-initial-delay-ms: ${MS06_SYNC_INITIAL_DELAY_MS:5000}
      refresh-throttle-ms: ${MS06_REFRESH_THROTTLE_MS:5000}
  campus:
    base-url: ${MS02_URL:http://localhost:8080}
    service-key: ${MS_SERVICE_KEY:${MS_SERVICE_TOKEN:}}
    buildings-path: ${MS02_BUILDINGS_PATH:/api/v1/buildings/{id}}
    safe-zones-path: ${MS02_SAFE_ZONES_PATH:/api/v1/safe-zones/{id}}
    connect-timeout-ms: ${CAMPUS_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${CAMPUS_READ_TIMEOUT_MS:2000}

logging:
  level:
    edu.eci.dosw.campusseguro.alertas: INFO
