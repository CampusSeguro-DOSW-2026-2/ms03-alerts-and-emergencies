spring:
  application:
    name: alerts-service
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: ${MAIL_CONNECT_TIMEOUT_MS:5000}
          timeout: ${MAIL_READ_TIMEOUT_MS:10000}
          writetimeout: ${MAIL_WRITE_TIMEOUT_MS:10000}

server:
  port: 8080

springdoc:
  paths-to-match: /api/**
  swagger-ui:
    path: /swagger-ui.html

app:
  timezone: ${APP_TIMEZONE:America/Bogota}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  catalog:
    ms01-url: ${MS01_URL:http://localhost:8081}
    ms02-url: ${MS02_URL:http://localhost:8082}
    service-token: ${MS_SERVICE_TOKEN:}
    connect-timeout-ms: ${CATALOG_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${CATALOG_READ_TIMEOUT_MS:5000}
    ms02:
      validate-scope-path: ${MS02_VALIDATE_SCOPE_PATH:/api/v1/catalogo/validar-alcance}
    ms01:
      validate-recipients-path: ${MS01_VALIDATE_RECIPIENTS_PATH:/api/v1/catalogo/validar-destinatarios}
      user-path: ${MS01_USER_PATH:/api/v1/usuarios/{id}}
      role-users-path: ${MS01_ROLE_USERS_PATH:/api/v1/usuarios?rol={role}}
  security:
    roles-claim: ${JWT_ROLES_CLAIM:roles}
  mail:
    # brevo (correo real) o log (simulado, solo registra en el log)
    provider: ${MAIL_PROVIDER:brevo}
    from: ${MAIL_FROM:no-reply@campusseguro.local}
    from-name: ${MAIL_FROM_NAME:CampusSeguro}
    app-base-url: ${APP_BASE_URL:http://localhost:5173}
    daily-limit: ${MAIL_DAILY_LIMIT:300}
    brevo:
      api-key: ${BREVO_API_KEY:}
      base-url: ${BREVO_API_URL:https://api.brevo.com}
      connect-timeout-ms: ${BREVO_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${BREVO_READ_TIMEOUT_MS:10000}
      max-attempts: ${BREVO_MAX_ATTEMPTS:3}
      retry-delay-ms: ${BREVO_RETRY_DELAY_MS:200}
