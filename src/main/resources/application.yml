spring:
  application:
    name: alerts-service
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: ${MAIL_CONNECT_TIMEOUT_MS:5000}
          timeout: ${MAIL_READ_TIMEOUT_MS:10000}
          writetimeout: ${MAIL_WRITE_TIMEOUT_MS:10000}

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health
  # El correo es opcional (el proveedor `log` no envía nada): su disponibilidad no debe
  # marcar el servicio como DOWN.
  health:
    mail:
      enabled: false
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: false

springdoc:
  paths-to-match: /api/**
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [%X{correlation_id:-}]"

app:
  timezone: ${APP_TIMEZONE:America/Bogota}
  catalog:
    # Las llamadas a MS01 pasan por el API Gateway: las rutas internas se autorizan por X-Service-Name.
    base-url: ${MS01_URL:http://localhost:8080}
    service-key: ${MS_SERVICE_KEY:${MS_SERVICE_TOKEN:}}
    connect-timeout-ms: ${CATALOG_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${CATALOG_READ_TIMEOUT_MS:2000}
  campus:
    # Validación del alcance (edificios y zonas) contra MS02 a través del API Gateway.
    base-url: ${MS02_URL:http://localhost:8080}
    service-key: ${MS_SERVICE_KEY:${MS_SERVICE_TOKEN:}}
    buildings-path: ${MS02_BUILDINGS_PATH:/api/v1/buildings/{id}}
    safe-zones-path: ${MS02_SAFE_ZONES_PATH:/api/v1/safe-zones/{id}}
    connect-timeout-ms: ${CAMPUS_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${CAMPUS_READ_TIMEOUT_MS:2000}
  mail:
    # brevo (correo real) o log (simulado, solo registra en el log)
    provider: ${MAIL_PROVIDER:brevo}
    from: ${MAIL_FROM:no-reply@campusseguro.local}
    from-name: ${MAIL_FROM_NAME:CampusSeguro}
    app-base-url: ${APP_BASE_URL:http://localhost:5173}
    daily-limit: ${MAIL_DAILY_LIMIT:300}
    brevo:
      api-key: ${BREVO_API_KEY:}
      base-url: ${BREVO_API_URL:https://api.brevo.com}
      connect-timeout-ms: ${BREVO_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${BREVO_READ_TIMEOUT_MS:10000}
      max-attempts: ${BREVO_MAX_ATTEMPTS:3}
      retry-delay-ms: ${BREVO_RETRY_DELAY_MS:200}
