spring:
  application:
    name: alerts-service
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    # Los scripts que ya se aplicaron a mano en una base desplegada quedaron
    # consolidados como V1..V7. Al baselinar en 7, esa base no los repite y solo
    # recibe las migraciones nuevas; una base vacia aplica V1..V7 desde cero.
    baseline-on-migrate: true
    baseline-version: 7
    locations: classpath:db/migration
  task:
    scheduling:
      # Las tareas programadas (activar alertas, auditoria hacia MS08, catalogos de MS06, reintento de correos)
      # no comparten un solo hilo: una llamada lenta a MS08 o MS06 no atrasa la activacion de una alerta.
      pool:
        size: ${SCHEDULING_POOL_SIZE:4}
  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: ${MAIL_CONNECT_TIMEOUT_MS:5000}
          timeout: ${MAIL_READ_TIMEOUT_MS:10000}
          writetimeout: ${MAIL_WRITE_TIMEOUT_MS:10000}

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health
  # El correo es opcional (el proveedor `log` no envía nada): su disponibilidad no debe
  # marcar el servicio como DOWN.
  health:
    mail:
      enabled: false
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: false

springdoc:
  paths-to-match: /api/**
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [%X{correlation_id:-}]"

app:
  timezone: ${APP_TIMEZONE:America/Bogota}
  catalog:
    # Las llamadas a MS01 pasan por el API Gateway: las rutas internas se autorizan por X-Service-Name.
    base-url: ${MS01_URL:http://localhost:8080}
    service-key: ${MS_SERVICE_KEY:${MS_SERVICE_TOKEN:}}
    connect-timeout-ms: ${CATALOG_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${CATALOG_READ_TIMEOUT_MS:2000}
  alerts:
    # Cada cuanto se buscan las alertas programadas que ya deben activarse.
    activation-check-ms: ${ALERT_ACTIVATION_CHECK_MS:2000}
    types:
      # MS06 es la fuente de verdad; el API Gateway publica /api/v1/tipos-alerta hacia MS06.
      base-url: ${MS06_URL:http://localhost:8080}
      path: ${MS06_ALERT_TYPES_PATH:/api/v1/tipos-alerta}
      service-key: ${MS_SERVICE_KEY:${MS_SERVICE_TOKEN:}}
      system-user-id: ${MS06_SYSTEM_USER_ID:00000000-0000-4000-8000-000000000000}
      system-user-role: ${MS06_SYSTEM_USER_ROLE:SERVICE_MS03}
      system-user-permissions: ${MS06_SYSTEM_USER_PERMISSIONS:ms06:real_event:read}
      connect-timeout-ms: ${MS06_CONNECT_TIMEOUT_MS:2000}
      read-timeout-ms: ${MS06_READ_TIMEOUT_MS:2000}
      # Sincronización periódica, arranque y throttle del refresco bajo demanda.
      sync-ms: ${MS06_SYNC_MS:60000}
      sync-initial-delay-ms: ${MS06_SYNC_INITIAL_DELAY_MS:5000}
      refresh-throttle-ms: ${MS06_REFRESH_THROTTLE_MS:5000}
  campus:
    # Validación del alcance (edificios y zonas) contra MS02 a través del API Gateway.
    base-url: ${MS02_URL:http://localhost:8080}
    service-key: ${MS_SERVICE_KEY:${MS_SERVICE_TOKEN:}}
    buildings-path: ${MS02_BUILDINGS_PATH:/api/v1/buildings/{id}}
    safe-zones-path: ${MS02_SAFE_ZONES_PATH:/api/v1/safe-zones/{id}}
    connect-timeout-ms: ${CAMPUS_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${CAMPUS_READ_TIMEOUT_MS:2000}
  audit:
    # Entrega de la auditoria a MS08 por el API Gateway (POST /api/v1/audit/events es ruta interna).
    # Apagarla detiene el envio; el historial local de MS03 sigue igual.
    enabled: ${AUDIT_ENABLED:true}
    base-url: ${MS08_URL:http://localhost:8080}
    events-path: ${MS08_AUDIT_EVENTS_PATH:/api/v1/audit/events}
    service-key: ${MS_SERVICE_KEY:${MS_SERVICE_TOKEN:}}
    connect-timeout-ms: ${AUDIT_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${AUDIT_READ_TIMEOUT_MS:5000}
    # Despacho de la bandeja de salida: cada cuanto se busca, tamano del lote, reintentos y backoff.
    dispatch-interval-ms: ${AUDIT_DISPATCH_INTERVAL_MS:5000}
    batch-size: ${AUDIT_BATCH_SIZE:50}
    max-attempts: ${AUDIT_MAX_ATTEMPTS:10}
    backoff-base-ms: ${AUDIT_BACKOFF_BASE_MS:5000}
    backoff-max-ms: ${AUDIT_BACKOFF_MAX_MS:3600000}
    # Un lote en envio mas viejo que esto se devuelve a pendientes (reinicio del proceso).
    stuck-timeout-ms: ${AUDIT_STUCK_TIMEOUT_MS:120000}
  mail:
    # brevo (correo real) o log (simulado, solo registra en el log)
    provider: ${MAIL_PROVIDER:brevo}
    from: ${MAIL_FROM:no-reply@campusseguro.local}
    from-name: ${MAIL_FROM_NAME:CampusSeguro}
    app-base-url: ${APP_BASE_URL:http://localhost:5173}
    # api: API de Brevo (BREVO_API_KEY). smtp: SMTP de spring.mail (MAIL_HOST, MAIL_USERNAME, MAIL_PASSWORD), con el
    # logo dentro del correo. Sin BREVO_API_KEY se usa SMTP.
    transport: ${MAIL_TRANSPORT:api}
    # Logo del correo por la API: URL pública de una imagen PNG (Brevo no admite imágenes incrustadas y algunos
    # clientes la bloquean). Vacío = el logo que publica el frontend en APP_BASE_URL/correo/campusseguro-logo.png.
    # Por SMTP no se usa: el logo va dentro del mensaje.
    logo-url: ${MAIL_LOGO_URL:}
    daily-limit: ${MAIL_DAILY_LIMIT:300}
    # Envio en bloque: por la API, correos por llamada a Brevo (hasta 1000); por SMTP o si Brevo rechaza un lote,
    # envios simultaneos. Hilos y cola de las alertas que se notifican a la vez.
    batch-size: ${MAIL_BATCH_SIZE:500}
    parallelism: ${MAIL_PARALLELISM:8}
    notification-threads: ${MAIL_NOTIFICATION_THREADS:4}
    notification-queue: ${MAIL_NOTIFICATION_QUEUE:500}
    # Reintento de las entregas fallidas de las alertas activas: cada cuanto y durante cuanto desde la activacion.
    retry-interval-ms: ${MAIL_RETRY_INTERVAL_MS:60000}
    retry-window-ms: ${MAIL_RETRY_WINDOW_MS:1800000}
    brevo:
      api-key: ${BREVO_API_KEY:}
      base-url: ${BREVO_API_URL:https://api.brevo.com}
      connect-timeout-ms: ${BREVO_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${BREVO_READ_TIMEOUT_MS:10000}
      max-attempts: ${BREVO_MAX_ATTEMPTS:3}
      retry-delay-ms: ${BREVO_RETRY_DELAY_MS:200}
