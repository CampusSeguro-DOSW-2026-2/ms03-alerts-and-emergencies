# Stack de MS03 en la nube: uno por entorno en la misma VM (ms03-prod y ms03-test).
# La base de datos NO vive en el stack: es una instancia administrada (RDS) fuera de la VM, en la
# misma VPC, y se alcanza por la red privada. No publica puertos: solo el Caddy de borde de la VM
# (red campus-edge) llega a MS03, con el alias ms03-<entorno>. Lo usa infra/deploy.sh con el .env
# que escribe en DEPLOY_DIR/<entorno>; no se ejecuta a mano.
name: ms03-${ENTORNO:?ENTORNO es obligatoria (test o prod)}

services:
  ms03:
    image: ${IMAGE:?IMAGE es obligatoria}:${TAG:?TAG es obligatoria (sha-xxxxxxx)}
    restart: unless-stopped
    environment:
      # Nunca `local` ni `test`: esos perfiles usan el catálogo de ejemplo y no validan contra MS02.
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8083"
      # Base administrada (RDS). TLS obligatorio: con `rds.force_ssl=1` una conexión sin
      # cifrar se rechaza, así que la URL debe llevar `sslmode=require`.
      DB_URL: ${DB_URL:?DB_URL es obligatoria (jdbc:postgresql://<endpoint>:5432/<base>?sslmode=require)}
      DB_USER: ${DB_USER:?DB_USER es obligatoria (campusseguro_test o campusseguro_prod)}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD es obligatoria}
      # MS01, MS02, MS06 y MS08 se alcanzan SIEMPRE por el Gateway: las rutas internas se autorizan con
      # X-Service-Name, que solo inyecta el GW, y MS02 exige la identidad del usuario. Sin MS06_URL y MS08_URL,
      # MS03 apunta a localhost y no sincroniza los tipos de alerta (MS06) ni entrega su auditoría (MS08).
      MS01_URL: ${GATEWAY_URL:?GATEWAY_URL es obligatoria (https://<dominio del GW> o :8443)}
      MS02_URL: ${GATEWAY_URL:?GATEWAY_URL es obligatoria (https://<dominio del GW> o :8443)}
      MS06_URL: ${GATEWAY_URL:?GATEWAY_URL es obligatoria (https://<dominio del GW> o :8443)}
      MS08_URL: ${GATEWAY_URL:?GATEWAY_URL es obligatoria (https://<dominio del GW> o :8443)}
      MS_SERVICE_KEY: ${GATEWAY_SERVICE_KEY:?GATEWAY_SERVICE_KEY es obligatoria}
      SPRINGDOC_ENABLED: "false"
      MAIL_PROVIDER: ${MAIL_PROVIDER:-log}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      # smtp = el logo va dentro del correo (requiere MAIL_HOST, MAIL_USERNAME y MAIL_PASSWORD)
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-api}
      MAIL_HOST: ${MAIL_HOST:-smtp-relay.brevo.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@campusseguro.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-CampusSeguro}
      APP_BASE_URL: ${APP_BASE_URL:-}
    # Variables opcionales del entorno (p. ej. INTERNAL_ALLOWED_SERVICES, MS04_REENVIO_SOLICITUDES_MS).
    env_file:
      - path: extra.env
        required: false
    networks:
      edge:
        aliases:
          - ms03-${ENTORNO}

networks:
  edge:
    name: campus-edge
    external: true
