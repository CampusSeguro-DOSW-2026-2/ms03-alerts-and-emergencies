name: SonarQube

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Build, tests and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # A self-hosted server is configured through the SONAR_HOST_URL
      # repository variable or secret. Without it, the public SonarCloud
      # instance is used.
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
      # SonarCloud requires the organization key; self-hosted ignores it.
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      # Lets a SonarCloud project use its own key (normally `<org>_<repo>`)
      # without editing the pom.
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'ms03-alerts-and-emergencies' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so Sonar can attribute new code correctly.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # `verify` runs the unit tests, the Testcontainers integration tests
      # and generates target/site/jacoco/jacoco.xml, which Sonar consumes.
      - name: Build and test
        run: mvn -B -ntp clean verify

      - name: Cache SonarQube packages
        if: env.SONAR_TOKEN != ''
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube analysis
        if: env.SONAR_TOKEN != ''
        run: |
          ARGS=(
            "-Dsonar.host.url=$SONAR_HOST_URL"
            "-Dsonar.token=$SONAR_TOKEN"
            "-Dsonar.projectKey=$SONAR_PROJECT_KEY"
            "-Dsonar.qualitygate.wait=true"
          )
          if [ -n "$SONAR_ORGANIZATION" ]; then
            ARGS+=("-Dsonar.organization=$SONAR_ORGANIZATION")
          elif [[ "$SONAR_HOST_URL" == *sonarcloud.io* ]]; then
            echo "::error::SONAR_ORGANIZATION must be set when analysing on SonarCloud."
            exit 1
          fi
          mvn -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:sonar "${ARGS[@]}"

      - name: SonarQube token missing
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::warning::SonarQube analysis skipped: add the SONAR_TOKEN repository secret."
          echo "::warning::For a self-hosted server also set SONAR_HOST_URL; for SonarCloud set SONAR_ORGANIZATION."
