name: SonarQube

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  analysis:
    name: Build, tests and static analysis
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Historial completo para que Sonar asigne bien el código nuevo
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # verify ejecuta pruebas unitarias, de integración (Testcontainers) y genera jacoco.xml
      - name: Build and test
        run: mvn -B verify

      - name: Cache SonarQube packages
        if: env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != ''
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Se omite hasta que el repositorio tenga configurados los secretos SONAR_TOKEN y SONAR_HOST_URL.
      - name: SonarQube analysis
        if: env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != ''
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.qualitygate.wait=true

      - name: SonarQube secrets missing
        if: env.SONAR_TOKEN == '' || env.SONAR_HOST_URL == ''
        run: echo "::warning::SonarQube analysis skipped. Configure the SONAR_TOKEN and SONAR_HOST_URL repository secrets."
