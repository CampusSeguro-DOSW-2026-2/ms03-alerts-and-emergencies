services:
  postgres:
    image: postgres:17-alpine
    container_name: campusseguro-alerts-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campusseguro_alerts}
      POSTGRES_USER: ${POSTGRES_USER:-campusseguro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campusseguro}
    ports:
      - "5432:5432"
    volumes:
      - alerts_pgdata:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  alerts_pgdata:
