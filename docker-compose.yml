services:
  postgres:
    image: postgres:17-alpine
    container_name: campusseguro-alerts-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campusseguro_alerts}
      POSTGRES_USER: ${POSTGRES_USER:-campusseguro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campusseguro}
    ports:
      - "5432:5432"
    volumes:
      - alerts_pgdata:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Análisis estático local: docker compose --profile sonar up -d (http://localhost:9000)
  sonarqube:
    image: sonarqube:community
    container_name: campusseguro-alerts-sonarqube
    profiles: ["sonar"]
    restart: unless-stopped
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  alerts_pgdata:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
