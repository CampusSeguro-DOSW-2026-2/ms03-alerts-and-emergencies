openapi: 3.1.0
info:
  title: MS03 - Alertas y Emergencias
  description: |
    API de gestion de alertas, ciclo de vida, confirmaciones, bandeja y
    auditoria de CampusSeguro.

    MS03 no valida JWT: confia en la identidad que inyecta el API Gateway en
    `X-User-Id`, `X-User-Role`, `X-Service-Name` y `X-Correlation-ID`. El
    servicio solo debe exponerse a traves del Gateway.

    `X-Service-Name` es un metadato opcional de auditoria. No altera el origen
    de la alerta, no otorga permisos y no tiene reglas especiales para `ms06`.

    Roles oficiales: ESTUDIANTE, PROFESOR, ADMINISTRATIVO, BRIGADISTA,
    COORDINADOR, ORGANIZADOR, ADMIN y AUDITOR.

    Permisos MS03: ms03:alert:manage, ms03:alert:manage_drill,
    ms03:alert:read_history y ms03:alert:receive. COORDINADOR administra
    alertas, ORGANIZADOR solo simulacros, AUDITOR consulta historial y la
    comunidad recibe alertas.

    Una alerta usa `types` con uno o varios valores. `OPERATIVA` es exclusiva
    y no puede combinarse con otros tipos ni usarse en simulacros.
  version: 3.0.0
  license:
    name: Uso academico - CampusSeguro
servers:
  - url: http://localhost:8080
    description: API Gateway local (MS03 escucha en 8083 sin exposicion directa)
tags:
  - name: Alertas
    description: Gestion y ciclo de vida de alertas
  - name: Bandeja
    description: Alertas dirigidas al actor autenticado
  - name: Confirmaciones
    description: Confirmacion de recepcion de alertas
  - name: Auditoria
    description: Consulta de eventos de auditoria
paths:
  /api/v1/alertas:
    parameters:
      - $ref: '#/components/parameters/UserIdHeader'
      - $ref: '#/components/parameters/UserRoleHeader'
      - $ref: '#/components/parameters/ServiceNameHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
    get:
      tags:
        - Alertas
      operationId: listAlerts
      summary: Listar alertas
      description: |
        Listado paginado, ordenado por fecha de creacion descendente. Requiere
        el permiso ms03:alert:read_history. El rango de fechas se aplica sobre
        createdAt. El parametro `type` puede repetirse y se evalua con logica
        OR: devuelve las alertas que contengan al menos uno de los tipos.
      x-permiso: ms03:alert:read_history
      x-roles:
        - COORDINADOR
        - ORGANIZADOR
        - AUDITOR
      parameters:
        - name: status
          in: query
          required: false
          description: Estado de la alerta.
          schema:
            $ref: '#/components/schemas/AlertStatus'
        - name: type
          in: query
          required: false
          description: |
            Tipo de alerta. Puede repetirse para filtrar por varios tipos.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/AlertType'
        - name: origin
          in: query
          required: false
          description: Origen de la alerta.
          schema:
            $ref: '#/components/schemas/AlertOrigin'
        - name: scope
          in: query
          required: false
          description: Tipo de alcance de la alerta.
          schema:
            $ref: '#/components/schemas/ScopeType'
        - name: activeAt
          in: query
          required: false
          description: Instante ISO 8601; devuelve las alertas que estaban activas en ese momento.
          schema:
            type: string
            format: date-time
        - name: startDate
          in: query
          required: false
          description: Fecha inicial (inclusive) de creacion, en formato ISO date.
          schema:
            type: string
            format: date
            example: '2026-10-01'
        - name: endDate
          in: query
          required: false
          description: Fecha final (inclusive) de creacion, en formato ISO date.
          schema:
            type: string
            format: date
            example: '2026-10-31'
        - name: simulationId
          in: query
          required: false
          description: Filtra por el simulacro asociado.
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          description: Numero de pagina, base cero.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Tamano de pagina, entre 1 y 100.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Listado paginado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseAlertSummaryResponse'
              examples:
                page:
                  value:
                    contenido:
                      - id: 7f3c1a2e-9b4d-4c8a-9f1e-2a6d5c8b7e10
                        types:
                          - EARTHQUAKE
                          - FIRE
                        title: Sismo en bloque B
                        scope:
                          type: BUILDING
                          ids:
                            - BLD-001
                        status: ACTIVE
                        origin: MANUAL
                        simulationId: null
                        createdAt: '2026-10-22T14:05:00Z'
                    page: 0
                    size: 20
                    total_elementos: 1
                    total_paginas: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Alertas
      operationId: createAlert
      summary: Crear alerta
      description: |
        Crea una alerta manual o asociada a un simulacro. Requiere
        ms03:alert:manage (COORDINADOR) o ms03:alert:manage_drill
        (ORGANIZADOR). El ORGANIZADOR solo puede operar alertas con
        origin.type = SIMULATION; en caso contrario responde 403 PROHIBIDO.

        `types` debe contener al menos un tipo y no admite duplicados.
        `OPERATIVA` es exclusiva y no puede usarse con origin SIMULATION.
        `type` singular no forma parte del contrato.

        Idempotencia MS06: si ya existe una alerta DRAFT, SCHEDULED o ACTIVE para el
        mismo simulationId y los datos de creacion coinciden, responde 200 con
        la alerta existente. Si los datos difieren, responde 409
        SIMULACION_DUPLICADA. La comparacion usa el conjunto de types, title,
        instructions, scope, recipients y activationAt.

        Si activateImmediately es true, la alerta se crea y se activa en la
        misma operacion, respondiendo 201 con estado ACTIVE. activateImmediately
        y activationAt son mutuamente excluyentes.
      x-permiso: ms03:alert:manage | ms03:alert:manage_drill
      x-roles:
        - COORDINADOR
        - ORGANIZADOR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertCreateRequest'
            examples:
              manual:
                summary: Alerta manual multtipo en borrador
                value:
                  types:
                    - EARTHQUAKE
                    - FIRE
                  title: Sismo en bloque B
                  scope:
                    type: BUILDING
                    ids:
                      - BLD-001
                  instructions: Evacuar el bloque B y dirigirse al punto de encuentro.
                  recipients:
                    - type: ROLE
                      id: ESTUDIANTE
                  origin:
                    type: MANUAL
              simulationScheduled:
                summary: Simulacro programado por MS06
                value:
                  types:
                    - EARTHQUAKE
                  title: Simulacro nacional de evacuacion
                  scope:
                    type: CAMPUS
                  instructions: Seguir las indicaciones de los brigadistas.
                  recipients:
                    - type: ROLE
                      id: ESTUDIANTE
                  origin:
                    type: SIMULATION
                    simulationId: 3c1f8e2a-5d7b-4a90-8c3e-1f2a4b6c8d90
                  activationAt: '2026-11-05T15:00:00Z'
              simulationImmediate:
                summary: Simulacro con activacion inmediata
                value:
                  types:
                    - EARTHQUAKE
                  title: Simulacro de evacuacion inmediata
                  scope:
                    type: CAMPUS
                  instructions: Evacuar de inmediato.
                  recipients:
                    - type: ROLE
                      id: ESTUDIANTE
                  origin:
                    type: SIMULATION
                    simulationId: 3c1f8e2a-5d7b-4a90-8c3e-1f2a4b6c8d90
                  activateImmediately: true
      responses:
        '201':
          description: Alerta creada.
          headers:
            Location:
              description: URI relativa de la alerta creada.
              schema:
                type: string
                example: /api/v1/alertas/7f3c1a2e-9b4d-4c8a-9f1e-2a6d5c8b7e10
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
              examples:
                created:
                  value:
                    id: 7f3c1a2e-9b4d-4c8a-9f1e-2a6d5c8b7e10
                    types:
                      - EARTHQUAKE
                    title: Simulacro nacional de evacuacion
                    status: SCHEDULED
                    origin: SIMULATION
                    simulationId: 3c1f8e2a-5d7b-4a90-8c3e-1f2a4b6c8d90
                    scope:
                      type: CAMPUS
                      ids: []
                    instructions: Seguir las indicaciones de los brigadistas.
                    recipients:
                      - type: ROLE
                        id: ESTUDIANTE
                    createdBy: 99999999-9999-4999-8999-999999999999
                    createdAt: '2026-10-22T14:05:00Z'
                    updatedAt: '2026-10-22T14:05:00Z'
                    activationAt: '2026-11-05T15:00:00Z'
                    activatedAt: null
                    archivedAt: null
        '200':
          description: Alerta existente para el simulationId (reintento idempotente).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/alertas/mias:
    parameters:
      - $ref: '#/components/parameters/UserIdHeader'
      - $ref: '#/components/parameters/UserRoleHeader'
      - $ref: '#/components/parameters/ServiceNameHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
    get:
      tags:
        - Bandeja
      operationId: getMyInbox
      summary: Consultar bandeja personal
      description: |
        Devuelve las alertas dirigidas al actor por destinatario USER, por rol o
        mediante una entrega de notificacion registrada. Requiere
        ms03:alert:receive.

        Por defecto solo devuelve alertas ACTIVE. El parametro `status` acepta
        ACTIVE, ARCHIVED o ALL. Las alertas DRAFT y SCHEDULED nunca aparecen.
        El orden es activatedAt descendente, luego createdAt descendente.
      x-permiso: ms03:alert:receive
      x-roles:
        - ESTUDIANTE
        - PROFESOR
        - ADMINISTRATIVO
        - BRIGADISTA
        - COORDINADOR
        - ORGANIZADOR
      parameters:
        - name: status
          in: query
          required: false
          description: Filtro de estado de la bandeja. Por defecto ACTIVE.
          schema:
            $ref: '#/components/schemas/InboxStatus'
        - name: page
          in: query
          required: false
          description: Numero de pagina, base cero.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Tamano de pagina, entre 1 y 100.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Bandeja paginada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseInboxAlertResponse'
              examples:
                inbox:
                  value:
                    contenido:
                      - id: 7f3c1a2e-9b4d-4c8a-9f1e-2a6d5c8b7e10
                        types:
                          - EARTHQUAKE
                          - FIRE
                        title: Sismo en bloque B
                        status: ACTIVE
                        origin: MANUAL
                        scope:
                          type: BUILDING
                          ids:
                            - BLD-001
                        instructions: Evacuar el bloque B.
                        activatedAt: '2026-10-22T14:06:00Z'
                        archivedAt: null
                        confirmedAt: null
                    page: 0
                    size: 20
                    total_elementos: 1
                    total_paginas: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/alertas/{id}:
    parameters:
      - $ref: '#/components/parameters/AlertId'
      - $ref: '#/components/parameters/UserIdHeader'
      - $ref: '#/components/parameters/UserRoleHeader'
      - $ref: '#/components/parameters/ServiceNameHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
    get:
      tags:
        - Alertas
      operationId: getAlert
      summary: Consultar alerta
      description: |
        Visible para usuarios con ms03:alert:receive o
        ms03:alert:read_history. AlertAccessPolicy permite el acceso a
        destinatarios directos, miembros del rol destinatario, usuarios con
        registro de envio y roles privilegiados (COORDINADOR, ORGANIZADOR y
        AUDITOR).
      x-permiso: ms03:alert:receive | ms03:alert:read_history
      x-roles:
        - ESTUDIANTE
        - PROFESOR
        - ADMINISTRATIVO
        - BRIGADISTA
        - COORDINADOR
        - ORGANIZADOR
        - AUDITOR
      responses:
        '200':
          description: Alerta encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Alertas
      operationId: updateAlert
      summary: Editar alerta
      description: |
        Solo alertas DRAFT o SCHEDULED. Requiere ms03:alert:manage o
        ms03:alert:manage_drill. El ORGANIZADOR solo puede editar alertas con
        origin SIMULATION. Si `types` viene presente, reemplaza el conjunto
        completo y aplica las mismas reglas de creacion. Una alerta ACTIVE o
        ARCHIVED responde 409 ESTADO_ALERTA_INVALIDO. Un conflicto de version
        responde 409 MODIFICACION_CONCURRENTE.
      x-permiso: ms03:alert:manage | ms03:alert:manage_drill
      x-roles:
        - COORDINADOR
        - ORGANIZADOR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertUpdateRequest'
            examples:
              instructions:
                summary: Cambiar solo las instrucciones
                value:
                  instructions: Evacuar por la salida norte y reunirse en la cancha.
              types:
                summary: Reemplazar los tipos
                value:
                  types:
                    - FIRE
                    - EARTHQUAKE
      responses:
        '200':
          description: Alerta actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/alertas/{id}/programar:
    parameters:
      - $ref: '#/components/parameters/AlertId'
      - $ref: '#/components/parameters/UserIdHeader'
      - $ref: '#/components/parameters/UserRoleHeader'
      - $ref: '#/components/parameters/ServiceNameHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
    patch:
      tags:
        - Alertas
      operationId: scheduleAlert
      summary: Programar alerta
      description: |
        Transicion DRAFT -> SCHEDULED. Requiere ms03:alert:manage o
        ms03:alert:manage_drill; el ORGANIZADOR solo puede programar alertas
        SIMULATION. La fecha de activacion debe ser futura; si es pasada o igual
        al instante actual responde 400 FECHA_ACTIVACION_INVALIDA. Cualquier
        otro estado de origen responde 409 TRANSICION_INVALIDA.
      x-permiso: ms03:alert:manage | ms03:alert:manage_drill
      x-roles:
        - COORDINADOR
        - ORGANIZADOR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertScheduleRequest'
            examples:
              schedule:
                value:
                  activationAt: '2026-11-05T15:00:00Z'
      responses:
        '200':
          description: Alerta programada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/alertas/{id}/activar:
    parameters:
      - $ref: '#/components/parameters/AlertId'
      - $ref: '#/components/parameters/UserIdHeader'
      - $ref: '#/components/parameters/UserRoleHeader'
      - $ref: '#/components/parameters/ServiceNameHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
    patch:
      tags:
        - Alertas
      operationId: activateAlert
      summary: Activar alerta
      description: |
        Permite los dos caminos validos hacia ACTIVE:

        - DRAFT -> ACTIVE (activacion manual inmediata).
        - SCHEDULED -> ACTIVE (scheduler o usuario adelantando la alerta,
          incluso antes de la fecha programada).

        Si la alerta ya esta ACTIVE la operacion es idempotente y responde 200
        sin una nueva notificacion. ARCHIVED responde 409 TRANSICION_INVALIDA.
        Requiere ms03:alert:manage o ms03:alert:manage_drill; el ORGANIZADOR
        solo puede activar alertas SIMULATION.
      x-permiso: ms03:alert:manage | ms03:alert:manage_drill
      x-roles:
        - COORDINADOR
        - ORGANIZADOR
      responses:
        '200':
          description: Alerta activa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/alertas/{id}/archivar:
    parameters:
      - $ref: '#/components/parameters/AlertId'
      - $ref: '#/components/parameters/UserIdHeader'
      - $ref: '#/components/parameters/UserRoleHeader'
      - $ref: '#/components/parameters/ServiceNameHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
    patch:
      tags:
        - Alertas
      operationId: archiveAlert
      summary: Archivar alerta
      description: |
        Transicion DRAFT, SCHEDULED o ACTIVE -> ARCHIVED. Requiere
        ms03:alert:manage o ms03:alert:manage_drill; el ORGANIZADOR solo puede
        archivar alertas SIMULATION. Si la alerta ya esta ARCHIVED la operacion
        es idempotente, responde 200, conserva archivedAt y no duplica la
        auditoria. ARCHIVED no admite cambios posteriores.
      x-permiso: ms03:alert:manage | ms03:alert:manage_drill
      x-roles:
        - COORDINADOR
        - ORGANIZADOR
      responses:
        '200':
          description: Alerta archivada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/alertas/{id}/confirmaciones:
    parameters:
      - $ref: '#/components/parameters/AlertId'
      - $ref: '#/components/parameters/UserIdHeader'
      - $ref: '#/components/parameters/UserRoleHeader'
      - $ref: '#/components/parameters/ServiceNameHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
    post:
      tags:
        - Confirmaciones
      operationId: confirmAlert
      summary: Confirmar recepcion
      description: |
        Registra la confirmacion explicita del usuario autenticado. Requiere
        ms03:alert:receive. La primera confirmacion responde 201; un reintento
        del mismo usuario responde 200 con la confirmacion existente. Solo para
        destinatarios autorizados por AlertAccessPolicy. La alerta debe estar
        ACTIVE; si no, responde 409 ALERTA_NO_ACTIVA. Abrir el enlace del correo
        no confirma la alerta.
      x-permiso: ms03:alert:receive
      x-roles:
        - ESTUDIANTE
        - PROFESOR
        - ADMINISTRATIVO
        - BRIGADISTA
        - COORDINADOR
        - ORGANIZADOR
      responses:
        '201':
          description: Confirmacion creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationResponse'
              examples:
                created:
                  value:
                    id: 0a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                    idAlerta: 7f3c1a2e-9b4d-4c8a-9f1e-2a6d5c8b7e10
                    usuarioId: 11111111-1111-4111-8111-111111111111
                    fechaConfirmacion: '2026-10-22T14:12:00Z'
        '200':
          description: Confirmacion ya existente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/alertas/{id}/auditoria:
    parameters:
      - $ref: '#/components/parameters/AlertId'
      - $ref: '#/components/parameters/UserIdHeader'
      - $ref: '#/components/parameters/UserRoleHeader'
      - $ref: '#/components/parameters/ServiceNameHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
    get:
      tags:
        - Auditoria
      operationId: getAlertAudit
      summary: Consultar auditoria
      description: |
        Devuelve los eventos de auditoria de la alerta ordenados por fecha
        ascendente. Requiere ms03:alert:read_history. Los eventos historicos con
        action END y estado ENDED se devuelven sin modificarse, aunque el ciclo
        de vida nuevo ya no los genera.
      x-permiso: ms03:alert:read_history
      x-roles:
        - COORDINADOR
        - ORGANIZADOR
        - AUDITOR
      responses:
        '200':
          description: Eventos de auditoria.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEventResponse'
              examples:
                timeline:
                  value:
                    - id: 9b8c7d6e-5f4a-4b3c-8d2e-1f0a9b8c7d6e
                      alertId: 7f3c1a2e-9b4d-4c8a-9f1e-2a6d5c8b7e10
                      actor: 77777777-7777-4777-8777-777777777777
                      actorType: USER
                      action: CREATE
                      fromStatus: null
                      toStatus: DRAFT
                      detail: 'Alert created: title=Sismo en bloque B, types=[EARTHQUAKE, FIRE]'
                      occurredAt: '2026-10-22T14:05:00Z'
                    - id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                      alertId: 7f3c1a2e-9b4d-4c8a-9f1e-2a6d5c8b7e10
                      actor: ms06:99999999-9999-4999-8999-999999999999
                      actorType: SERVICE
                      action: ARCHIVE
                      fromStatus: ACTIVE
                      toStatus: ARCHIVED
                      detail: 'Alert archived'
                      occurredAt: '2026-10-22T14:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    AlertId:
      name: id
      in: path
      required: true
      description: Identificador UUID de la alerta.
      schema:
        type: string
        format: uuid
    UserIdHeader:
      name: X-User-Id
      in: header
      required: true
      description: UUID del usuario emisor, inyectado por el API Gateway.
      schema:
        type: string
        format: uuid
    UserRoleHeader:
      name: X-User-Role
      in: header
      required: true
      description: |
        Uno o varios roles oficiales separados por coma. Valores permitidos:
        ESTUDIANTE, PROFESOR, ADMINISTRATIVO, BRIGADISTA, COORDINADOR,
        ORGANIZADOR, ADMIN y AUDITOR.
      schema:
        type: string
        example: COORDINADOR
    ServiceNameHeader:
      name: X-Service-Name
      in: header
      required: false
      description: |
        Metadato opcional de auditoria. No altera el origen de la alerta ni los
        permisos. El actor auditado se registra como `{servicio}:{actor}`.
      schema:
        type: string
    CorrelationIdHeader:
      name: X-Correlation-ID
      in: header
      required: false
      description: |
        UUID v4 de correlacion. Si falta o no es valido, MS03 genera uno nuevo
        y lo devuelve en la respuesta.
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: |
        Datos invalidos. Puede ser VALIDACION, REFERENCIA_INVALIDA,
        PAGINACION_INVALIDA o FECHA_ACTIVACION_INVALIDA.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validation:
              value:
                status: 400
                codigo: VALIDACION
                mensaje: Los datos enviados no son validos
                errores:
                  - campo: types
                    mensaje: Alert types cannot contain duplicates
                correlation_id: 11111111-1111-4111-8111-111111111111
            pagination:
              value:
                status: 400
                codigo: PAGINACION_INVALIDA
                mensaje: Los parametros de consulta no son validos
                errores:
                  - campo: size
                    mensaje: Page size must be between 1 and 100
                correlation_id: 11111111-1111-4111-8111-111111111111
            activationDate:
              value:
                status: 400
                codigo: FECHA_ACTIVACION_INVALIDA
                mensaje: La fecha de activacion debe ser futura
                errores: []
                correlation_id: 11111111-1111-4111-8111-111111111111
    Unauthorized:
      description: |
        Faltan las cabeceras de identidad, son invalidas o el rol no pertenece
        a la matriz oficial. El Gateway debe inyectarlas.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorized:
              value:
                status: 401
                codigo: NO_AUTENTICADO
                mensaje: Se requiere autenticacion o la identidad no es valida
                errores: []
                correlation_id: 11111111-1111-4111-8111-111111111111
    Forbidden:
      description: |
        El permiso no permite la operacion (PROHIBIDO) o el usuario no es
        destinatario de la alerta (NO_ES_DESTINATARIO).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              value:
                status: 403
                codigo: PROHIBIDO
                mensaje: El rol ORGANIZADOR solo puede operar alertas asociadas a un simulacro
                errores: []
                correlation_id: 11111111-1111-4111-8111-111111111111
            notARecipient:
              value:
                status: 403
                codigo: NO_ES_DESTINATARIO
                mensaje: No eres destinatario de esta alerta
                errores: []
                correlation_id: 11111111-1111-4111-8111-111111111111
    NotFound:
      description: La alerta no existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            alertNotFound:
              value:
                status: 404
                codigo: ALERTA_NO_ENCONTRADA
                mensaje: 'No se encontro la alerta con ID: 7f3c1a2e-9b4d-4c8a-9f1e-2a6d5c8b7e10'
                errores: []
                correlation_id: 11111111-1111-4111-8111-111111111111
    Conflict:
      description: |
        Conflicto de estado o de datos: ESTADO_ALERTA_INVALIDO,
        TRANSICION_INVALIDA, ALERTA_NO_ACTIVA, SIMULACION_DUPLICADA o
        MODIFICACION_CONCURRENTE.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidAlertState:
              value:
                status: 409
                codigo: ESTADO_ALERTA_INVALIDO
                mensaje: El estado de la alerta no permite esta operacion
                errores: []
                correlation_id: 11111111-1111-4111-8111-111111111111
            invalidTransition:
              value:
                status: 409
                codigo: TRANSICION_INVALIDA
                mensaje: La transicion de estado solicitada no es valida
                errores: []
                correlation_id: 11111111-1111-4111-8111-111111111111
            alertNotActive:
              value:
                status: 409
                codigo: ALERTA_NO_ACTIVA
                mensaje: La alerta no esta activa
                errores: []
                correlation_id: 11111111-1111-4111-8111-111111111111
            duplicateSimulationAlert:
              value:
                status: 409
                codigo: SIMULACION_DUPLICADA
                mensaje: 'Ya existe una alerta viva para el simulacro 3c1f8e2a-5d7b-4a90-8c3e-1f2a4b6c8d90'
                errores: []
                correlation_id: 11111111-1111-4111-8111-111111111111
            concurrentModification:
              value:
                status: 409
                codigo: MODIFICACION_CONCURRENTE
                mensaje: La alerta fue modificada por otro usuario
                errores: []
                correlation_id: 11111111-1111-4111-8111-111111111111
    ServiceUnavailable:
      description: Un servicio externo (MS01 o MS02) no esta disponible.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unavailable:
              value:
                status: 503
                codigo: SERVICIO_EXTERNO_NO_DISPONIBLE
                mensaje: El servicio externo no esta disponible. Intenta de nuevo mas tarde
                errores: []
                correlation_id: 11111111-1111-4111-8111-111111111111
  schemas:
    AlertStatus:
      type: string
      enum:
        - DRAFT
        - SCHEDULED
        - ACTIVE
        - ARCHIVED
    AlertType:
      type: string
      enum:
        - EARTHQUAKE
        - FIRE
        - OTHER
        - OPERATIVA
    AlertOrigin:
      type: string
      enum:
        - MANUAL
        - SIMULATION
    InboxStatus:
      type: string
      enum:
        - ACTIVE
        - ARCHIVED
        - ALL
    ScopeType:
      type: string
      enum:
        - CAMPUS
        - BUILDING
        - ZONE
    RecipientType:
      type: string
      enum:
        - USER
        - ROLE
    AuditAction:
      type: string
      description: |
        Acciones actuales y valores historicos de solo lectura. El codigo nuevo
        no genera END.
      enum:
        - CREATE
        - UPDATE
        - SCHEDULE
        - ACTIVATE
        - END
        - ARCHIVE
        - CONFIRM
        - NOTIFICATION_SENT
        - NOTIFICATION_FAILED
        - RECIPIENT_RESOLUTION_FAILED
    AuditStatus:
      type: string
      description: |
        Estados actuales y el valor historico ENDED, conservado para lectura.
      enum:
        - DRAFT
        - SCHEDULED
        - ACTIVE
        - ENDED
        - ARCHIVED
    ScopeRequest:
      type: object
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/ScopeType'
        ids:
          type: array
          description: Obligatorio y no vacio cuando type es BUILDING o ZONE.
          items:
            type: string
          example:
            - BLD-001
    RecipientRequest:
      type: object
      required:
        - type
        - id
      properties:
        type:
          $ref: '#/components/schemas/RecipientType'
        id:
          type: string
          maxLength: 64
          description: |
            UUID del usuario cuando type es USER. Uno de los 8 roles oficiales
            cuando type es ROLE.
          examples:
            - 11111111-1111-4111-8111-111111111111
            - ESTUDIANTE
    AlertOriginRequest:
      type: object
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/AlertOrigin'
        simulationId:
          type: string
          format: uuid
          description: Obligatorio si origin.type es SIMULATION; prohibido si es MANUAL.
    AlertCreateRequest:
      type: object
      required:
        - types
        - title
        - instructions
        - recipients
      properties:
        types:
          type: array
          minItems: 1
          uniqueItems: true
          description: |
            Uno o varios tipos. OPERATIVA debe ser el unico tipo y no puede
            usarse con origin SIMULATION.
          items:
            $ref: '#/components/schemas/AlertType'
        title:
          type: string
          maxLength: 150
          minLength: 1
          example: Simulacro nacional de evacuacion
        scope:
          $ref: '#/components/schemas/ScopeRequest'
          description: |
            Alcance unico. Alternativa a scopes; se debe enviar exactamente uno
            de los dos.
        scopes:
          type: array
          minItems: 1
          description: |
            Alternativa a scope para alertas que cubren varios tipos de alcance
            (por ejemplo edificios y zonas). Si viene, tiene prioridad sobre scope.
          items:
            $ref: '#/components/schemas/ScopeRequest'
        instructions:
          type: string
          maxLength: 1000
          minLength: 1
          example: Seguir las indicaciones de los brigadistas.
        recipients:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RecipientRequest'
        origin:
          $ref: '#/components/schemas/AlertOriginRequest'
        activationAt:
          type: string
          format: date-time
          description: |
            Si es futura, la alerta nace SCHEDULED. Mutuamente excluyente con
            activateImmediately. Si es pasada o igual al instante actual,
            responde 400 FECHA_ACTIVACION_INVALIDA.
        activateImmediately:
          type: boolean
          description: |
            Si es true, crea la alerta y la activa en la misma operacion.
            Mutuamente excluyente con activationAt.
        purpose:
          type: string
          maxLength: 32
          description: |
            Proposito de la alerta dentro de su simulacro/evento (BRIGADISTS,
            GENERAL, EDIT, FINISH). Permite varias alertas vivas con el mismo
            simulationId y forma parte de la clave de idempotencia.
    AlertUpdateRequest:
      type: object
      minProperties: 1
      properties:
        types:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AlertType'
        title:
          type: string
          maxLength: 150
          minLength: 1
        scope:
          $ref: '#/components/schemas/ScopeRequest'
        instructions:
          type: string
          maxLength: 1000
          minLength: 1
        recipients:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RecipientRequest'
    AlertScheduleRequest:
      type: object
      required:
        - activationAt
      properties:
        activationAt:
          type: string
          format: date-time
    AlertResponse:
      type: object
      required:
        - id
        - types
        - title
        - status
        - origin
        - scope
        - instructions
        - recipients
        - createdBy
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        types:
          type: array
          items:
            $ref: '#/components/schemas/AlertType'
        title:
          type: string
        status:
          $ref: '#/components/schemas/AlertStatus'
        origin:
          $ref: '#/components/schemas/AlertOrigin'
        simulationId:
          type:
            - string
            - 'null'
          format: uuid
        purpose:
          type:
            - string
            - 'null'
          maxLength: 32
          description: Proposito de la alerta dentro de su simulacro/evento.
        scope:
          $ref: '#/components/schemas/ScopeRequest'
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ScopeRequest'
          description: Alcance agrupado por tipo; puede tener varios elementos.
        instructions:
          type: string
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/RecipientRequest'
        createdBy:
          type: string
          description: Actor que creo la alerta (UUID del usuario o actor de servicio).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        activationAt:
          type:
            - string
            - 'null'
          format: date-time
        activatedAt:
          type:
            - string
            - 'null'
          format: date-time
        archivedAt:
          type:
            - string
            - 'null'
          format: date-time
    AlertSummaryResponse:
      type: object
      description: |
        Resumen para el listado. Incluye instrucciones y destinatarios para que
        el cliente no tenga que pedir el detalle de cada alerta.
      required:
        - id
        - types
        - title
        - status
        - origin
        - scope
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        types:
          type: array
          items:
            $ref: '#/components/schemas/AlertType'
        title:
          type: string
        purpose:
          type:
            - string
            - 'null'
          maxLength: 32
        scope:
          $ref: '#/components/schemas/ScopeRequest'
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ScopeRequest'
        status:
          $ref: '#/components/schemas/AlertStatus'
        origin:
          $ref: '#/components/schemas/AlertOrigin'
        simulationId:
          type:
            - string
            - 'null'
          format: uuid
        createdAt:
          type: string
          format: date-time
        instructions:
          type: string
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/RecipientRequest'
    InboxAlertResponse:
      type: object
      required:
        - id
        - types
        - title
        - status
        - origin
        - scope
        - instructions
        - activatedAt
        - archivedAt
        - confirmedAt
      properties:
        id:
          type: string
          format: uuid
        types:
          type: array
          items:
            $ref: '#/components/schemas/AlertType'
        title:
          type: string
        status:
          $ref: '#/components/schemas/AlertStatus'
        origin:
          $ref: '#/components/schemas/AlertOrigin'
        purpose:
          type:
            - string
            - 'null'
          maxLength: 32
        scope:
          $ref: '#/components/schemas/ScopeRequest'
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ScopeRequest'
        instructions:
          type: string
        activatedAt:
          type:
            - string
            - 'null'
          format: date-time
        archivedAt:
          type:
            - string
            - 'null'
          format: date-time
        confirmedAt:
          type:
            - string
            - 'null'
          format: date-time
    PageResponseAlertSummaryResponse:
      type: object
      required:
        - contenido
        - page
        - size
        - total_elementos
        - total_paginas
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/AlertSummaryResponse'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        total_elementos:
          type: integer
          format: int64
        total_paginas:
          type: integer
          format: int32
    PageResponseInboxAlertResponse:
      type: object
      required:
        - contenido
        - page
        - size
        - total_elementos
        - total_paginas
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/InboxAlertResponse'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        total_elementos:
          type: integer
          format: int64
        total_paginas:
          type: integer
          format: int32
    ConfirmationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        idAlerta:
          type: string
          format: uuid
        usuarioId:
          type: string
          format: uuid
        fechaConfirmacion:
          type: string
          format: date-time
    AuditEventResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        alertId:
          type: string
          format: uuid
        actor:
          type: string
        actorType:
          type: string
          enum:
            - USER
            - SERVICE
            - SYSTEM
        action:
          $ref: '#/components/schemas/AuditAction'
        fromStatus:
          oneOf:
            - $ref: '#/components/schemas/AuditStatus'
            - type: 'null'
        toStatus:
          oneOf:
            - $ref: '#/components/schemas/AuditStatus'
            - type: 'null'
        detail:
          type: string
        occurredAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - codigo
        - mensaje
        - errores
        - correlation_id
      properties:
        status:
          type: integer
          description: Codigo HTTP de la respuesta.
        codigo:
          type: string
          enum:
            - VALIDACION
            - REFERENCIA_INVALIDA
            - PAGINACION_INVALIDA
            - FECHA_ACTIVACION_INVALIDA
            - NO_AUTENTICADO
            - PROHIBIDO
            - NO_ES_DESTINATARIO
            - ALERTA_NO_ENCONTRADA
            - NO_ENCONTRADO
            - METODO_NO_PERMITIDO
            - TIPO_NO_SOPORTADO
            - ESTADO_ALERTA_INVALIDO
            - TRANSICION_INVALIDA
            - ALERTA_NO_ACTIVA
            - SIMULACION_DUPLICADA
            - MODIFICACION_CONCURRENTE
            - SERVICIO_EXTERNO_NO_DISPONIBLE
            - ERROR_INTERNO
        mensaje:
          type: string
        errores:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        correlation_id:
          type: string
          format: uuid
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
        - campo
        - mensaje
      properties:
        campo:
          type: string
        mensaje:
          type: string
