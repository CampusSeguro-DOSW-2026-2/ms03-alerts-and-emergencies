openapi: 3.1.0
info:
  title: MS03 - Alertas y Emergencias
  description: |
    API de gestion de alertas, ciclo de vida, confirmaciones y auditoria de
    CampusSeguro.

    MS03 no valida JWT: confia en la identidad que inyecta el API Gateway en
    `X-User-Id`, `X-User-Role`, `X-Service-Name` y `X-Correlation-ID`. El
    servicio solo debe exponerse a traves del Gateway.

    Roles oficiales: ESTUDIANTE, PROFESOR, ADMINISTRATIVO, BRIGADISTA,
    COORDINADOR, ORGANIZADOR, ADMIN y AUDITOR. No existe el rol RECIPIENT: el
    acceso de un usuario generico a GET /alertas/{id} y a
    POST /alertas/{id}/confirmaciones lo decide AlertAccessPolicy.

    Permisos MS03: ms03:alert:manage, ms03:alert:manage_drill,
    ms03:alert:read_history y ms03:alert:receive. COORDINADOR administra
    alertas, ORGANIZADOR solo simulacros, AUDITOR consulta historial y la
    comunidad recibe alertas.
  version: 2.0.0
  license:
    name: Uso academico - CampusSeguro
servers:
  - url: http://localhost:8080
    description: API Gateway local (MS03 escucha en 8083 sin exposicion directa)
tags:
  - name: Alertas
    description: Gestion y ciclo de vida de alertas
  - name: Confirmaciones
    description: Confirmacion de recepcion de alertas
  - name: Auditoria
    description: Consulta de eventos de auditoria
paths:
  /api/v1/alertas:
    parameters:
      - $ref: '#/components/parameters/UserIdHeader'
      - $ref: '#/components/parameters/UserRoleHeader'
      - $ref: '#/components/parameters/ServiceNameHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
    get:
      tags:
        - Alertas
      operationId: listAlerts
      summary: Listar alertas
      description: |
        Listado paginado, ordenado por fecha de creacion descendente. Requiere
        el permiso ms03:alert:read_history. El rango de fechas se aplica sobre
        createdAt.
      x-permiso: ms03:alert:read_history
      x-roles:
        - COORDINADOR
        - ORGANIZADOR
        - AUDITOR
      parameters:
        - name: status
          in: query
          required: false
          description: Estado de la alerta.
          schema:
            $ref: '#/components/schemas/AlertStatus'
        - name: type
          in: query
          required: false
          description: Tipo de alerta.
          schema:
            $ref: '#/components/schemas/AlertType'
        - name: startDate
          in: query
          required: false
          description: Fecha inicial (inclusive) de creacion, en formato ISO date.
          schema:
            type: string
            format: date
            example: '2026-10-01'
        - name: endDate
          in: query
          required: false
          description: Fecha final (inclusive) de creacion, en formato ISO date.
          schema:
            type: string
            format: date
            example: '2026-10-31'
        - name: simulationId
          in: query
          required: false
          description: Filtra por el simulacro asociado.
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          description: Numero de pagina, base cero.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Tamano de pagina, entre 1 y 100.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Listado paginado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseAlertSummaryResponse'
              examples:
                page:
                  value:
                    contenido:
                      - id: 7f3c1a2e-9b4d-4c8a-9f1e-2a6d5c8b7e10
                        type: EARTHQUAKE
                        title: Sismo en bloque B
                        scope:
                          type: BUILDING
                          ids:
                            - BLD-001
                        status: ACTIVE
                        origin: MANUAL
                        simulationId: null
                        createdAt: '2026-10-22T14:05:00Z'
                    page: 0
                    size: 20
                    total_elementos: 1
                    total_paginas: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Alertas
      operationId: createAlert
      summary: Crear alerta
      description: |
        Crea una alerta manual o asociada a un simulacro. Requiere
        ms03:alert:manage (COORDINADOR) o ms03:alert:manage_drill
        (ORGANIZADOR). El ORGANIZADOR solo puede crear alertas con
        origin.type = SIMULATION; en caso contrario responde 403 PROHIBIDO.

        Idempotencia MS06: si ya existe una alerta SCHEDULED o ACTIVE para el
        mismo simulationId y los datos de creacion coinciden, responde 200 con
        la alerta existente. Si los datos difieren, responde 409
        SIMULACION_DUPLICADA. La comparacion usa type, title, instructions,
        scope, recipients y activationAt.

        Si activateImmediately es true, la alerta se crea y se activa en la
        misma operacion, respondiendo 201 con estado ACTIVE. Se acepta el
        alias activarInmediatamente. En origin se acepta eventId como alias de
        simulationId y tipo como alias de type.
      x-permiso: ms03:alert:manage | ms03:alert:manage_drill
      x-roles:
        - COORDINADOR
        - ORGANIZADOR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertCreateRequest'
            examples:
              manual:
                summary: Alerta manual en borrador
                value:
                  type: EARTHQUAKE
                  title: Sismo en bloque B
                  scope:
                    type: BUILDING
                    ids:
                      - BLD-001
                  instructions: Evacuar el bloque B y dirigirse al punto de encuentro.
                  recipients:
                    - type: ROLE
                      id: ESTUDIANTE
                  origin:
                    type: MANUAL
              simulationScheduled:
                summary: Simulacro programado por MS06
                value:
                  type: SIMULATION
                  title: Simulacro nacional de evacuacion
                  scope:
                    type: CAMPUS
                  instructions: Seguir las indicaciones de los brigadistas.
                  recipients:
                    - type: ROLE
                      id: ESTUDIANTE
                  origin:
                    type: SIMULATION
                    simulationId: 3c1f8e2a-5d7b-4a90-8c3e-1f2a4b6c8d90
                  activationAt: '2026-11-05T15:00:00Z'
              simulationImmediate:
                summary: Simulacro con activacion inmediata
                value:
                  type: SIMULATION
                  title: Simulacro de evacuacion inmediata
                  scope:
                    type: CAMPUS
                  instructions: Evacuar de inmediato.
                  recipients:
                    - type: ROLE
                      id: ESTUDIANTE
                  origin:
                    type: SIMULATION
                    simulationId: 3c1f8e2a-5d7b-4a90-8c3e-1f2a4b6c8d90
                  activateImmediately: true
      responses:
        '201':
          description: Alerta creada.
          headers:
            Location:
              description: URI relativa de la alerta creada.
              schema:
                type: string
                example: /api/v1/alertas/7f3c1a2e-9b4d-4c8a-9f1e-2a6d5c8b7e10
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
              examples:
                created:
                  value:
                    id: 7f3c1a2e-9b4d-4c8a-9f1e-2a6d5c8b7e10
                    type: SIMULATION
                    title: Simulacro nacional de evacuacion
                    status: SCHEDULED
                    origin: SIMULATION
                    simulationId: 3c1f8e2a-5d7b-4a90-8c3e-1f2a4b6c8d90
                    scope:
                      type: CAMPUS
                      ids: []
                    instructions: Seguir las indicaciones de los brigadistas.
                    recipients:
                      - type: ROLE
                        id: ESTUDIANTE
                    createdBy: 99999999-9999-4999-8999-999999999999
                    createdAt: '2026-10-22T14:05:00Z'
                    updatedAt: '2026-10-22T14:05:00Z'
                    activationAt: '2026-11-05T15:00:00Z'
                    activatedAt: null
                    endedAt: null
                    archivedAt: null
        '200':
          description: Alerta existente para el simulationId (reintento idempotente).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/alertas/{id}:
    parameters:
      - $ref: '#/components/parameters/AlertId'
      - $ref: '#/components/parameters/UserIdHeader'
      - $ref: '#/components/parameters/UserRoleHeader'
      - $ref: '#/components/parameters/ServiceNameHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
    get:
      tags:
        - Alertas
      operationId: getAlert
      summary: Consultar alerta
      description: |
        Visible para usuarios con ms03:alert:receive o
        ms03:alert:read_history. AlertAccessPolicy permite el acceso a
        destinatarios directos, miembros del rol destinatario, usuarios con
        registro de envio y roles privilegiados (COORDINADOR, ORGANIZADOR y
        AUDITOR).
      x-permiso: ms03:alert:receive | ms03:alert:read_history
      x-roles:
        - ESTUDIANTE
        - PROFESOR
        - ADMINISTRATIVO
        - BRIGADISTA
        - COORDINADOR
        - ORGANIZADOR
        - AUDITOR
      responses:
        '200':
          description: Alerta encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Alertas
      operationId: updateAlert
      summary: Editar alerta
      description: |
        Solo COORDINADOR (ms03:alert:manage) y solo alertas DRAFT o SCHEDULED.
        Se actualizan unicamente los campos enviados. Si la alerta esta ACTIVE,
        ENDED o ARCHIVED responde 409 ESTADO_ALERTA_INVALIDO. Un conflicto de
        version responde 409 MODIFICACION_CONCURRENTE.
      x-permiso: ms03:alert:manage
      x-roles:
        - COORDINADOR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertUpdateRequest'
            examples:
              instructions:
                summary: Cambiar solo las instrucciones
                value:
                  instructions: Evacuar por la salida norte y reunirse en la cancha.
      responses:
        '200':
          description: Alerta actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/alertas/{id}/programar:
    parameters:
      - $ref: '#/components/parameters/AlertId'
      - $ref: '#/components/parameters/UserIdHeader'
      - $ref: '#/components/parameters/UserRoleHeader'
      - $ref: '#/components/parameters/ServiceNameHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
    patch:
      tags:
        - Alertas
      operationId: scheduleAlert
      summary: Programar alerta
      description: |
        Transicion DRAFT -> SCHEDULED. Solo COORDINADOR. La fecha de activacion
        debe ser futura; si es pasada o igual al instante actual responde 400
        FECHA_ACTIVACION_INVALIDA. Cualquier otro estado de origen responde 409
        TRANSICION_INVALIDA.
      x-permiso: ms03:alert:manage
      x-roles:
        - COORDINADOR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertScheduleRequest'
            examples:
              schedule:
                value:
                  activationAt: '2026-11-05T15:00:00Z'
      responses:
        '200':
          description: Alerta programada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/alertas/{id}/activar:
    parameters:
      - $ref: '#/components/parameters/AlertId'
      - $ref: '#/components/parameters/UserIdHeader'
      - $ref: '#/components/parameters/UserRoleHeader'
      - $ref: '#/components/parameters/ServiceNameHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
    patch:
      tags:
        - Alertas
      operationId: activateAlert
      summary: Activar alerta
      description: |
        Permite los dos caminos validos hacia ACTIVE:

        - DRAFT -> ACTIVE (activacion manual inmediata o MS06).
        - SCHEDULED -> ACTIVE (scheduler o coordinador adelantando la alerta,
          incluso antes de la fecha programada).

        Si la alerta ya esta ACTIVE la operacion es idempotente y responde 200
        sin una nueva notificacion. ENDED o ARCHIVED responde 409
        TRANSICION_INVALIDA. Requiere ms03:alert:manage (COORDINADOR) o
        ms03:alert:manage_drill (ORGANIZADOR).
      x-permiso: ms03:alert:manage | ms03:alert:manage_drill
      x-roles:
        - COORDINADOR
        - ORGANIZADOR
      responses:
        '200':
          description: Alerta activa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/alertas/{id}/finalizar:
    parameters:
      - $ref: '#/components/parameters/AlertId'
      - $ref: '#/components/parameters/UserIdHeader'
      - $ref: '#/components/parameters/UserRoleHeader'
      - $ref: '#/components/parameters/ServiceNameHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
    patch:
      tags:
        - Alertas
      operationId: endAlert
      summary: Finalizar alerta
      description: |
        Transicion ACTIVE -> ENDED. Si ya esta ENDED responde 200 sin cambios.
        DRAFT, SCHEDULED o ARCHIVED responde 409 TRANSICION_INVALIDA. Requiere
        ms03:alert:manage o ms03:alert:manage_drill.

        Cuando el actor es MS06 (X-Service-Name: ms06) o un ORGANIZADOR, el
        cuerpo es obligatorio y debe incluir simulationId; si falta responde
        400 VALIDACION y si no coincide con el de la alerta responde 409
        CONFLICTO_SIMULACION. Se acepta eventId como alias de simulationId.
      x-permiso: ms03:alert:manage | ms03:alert:manage_drill
      x-roles:
        - COORDINADOR
        - ORGANIZADOR
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertEndRequest'
            examples:
              service:
                summary: Finalizacion por MS06
                value:
                  simulationId: 3c1f8e2a-5d7b-4a90-8c3e-1f2a4b6c8d90
              coordinator:
                summary: Finalizacion manual sin cuerpo
                value: {}
      responses:
        '200':
          description: Alerta finalizada o ya finalizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/alertas/{id}/archivar:
    parameters:
      - $ref: '#/components/parameters/AlertId'
      - $ref: '#/components/parameters/UserIdHeader'
      - $ref: '#/components/parameters/UserRoleHeader'
      - $ref: '#/components/parameters/ServiceNameHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
    patch:
      tags:
        - Alertas
      operationId: archiveAlert
      summary: Archivar alerta
      description: |
        Transicion ENDED -> ARCHIVED. Solo COORDINADOR. Cualquier otro estado
        responde 409 TRANSICION_INVALIDA. Una alerta archivada no admite
        cambios.
      x-permiso: ms03:alert:manage
      x-roles:
        - COORDINADOR
      responses:
        '200':
          description: Alerta archivada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/alertas/{id}/confirmaciones:
    parameters:
      - $ref: '#/components/parameters/AlertId'
      - $ref: '#/components/parameters/UserIdHeader'
      - $ref: '#/components/parameters/UserRoleHeader'
      - $ref: '#/components/parameters/ServiceNameHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
    post:
      tags:
        - Confirmaciones
      operationId: confirmAlert
      summary: Confirmar recepcion
      description: |
        Registra la confirmacion del usuario autenticado. Requiere
        ms03:alert:receive. La primera confirmacion responde 201; un reintento
        del mismo usuario responde 200 con la confirmacion existente. Solo para
        destinatarios autorizados por AlertAccessPolicy. La alerta debe estar
        ACTIVE.
      x-permiso: ms03:alert:receive
      x-roles:
        - ESTUDIANTE
        - PROFESOR
        - ADMINISTRATIVO
        - BRIGADISTA
        - COORDINADOR
        - ORGANIZADOR
      responses:
        '201':
          description: Confirmacion creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationResponse'
              examples:
                created:
                  value:
                    id: 0a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                    idAlerta: 7f3c1a2e-9b4d-4c8a-9f1e-2a6d5c8b7e10
                    usuarioId: 11111111-1111-4111-8111-111111111111
                    fechaConfirmacion: '2026-10-22T14:12:00Z'
        '200':
          description: Confirmacion ya existente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/alertas/{id}/auditoria:
    parameters:
      - $ref: '#/components/parameters/AlertId'
      - $ref: '#/components/parameters/UserIdHeader'
      - $ref: '#/components/parameters/UserRoleHeader'
      - $ref: '#/components/parameters/ServiceNameHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
    get:
      tags:
        - Auditoria
      operationId: getAlertAudit
      summary: Consultar auditoria
      description: |
        Devuelve los eventos de auditoria de la alerta ordenados por fecha
        ascendente. Requiere ms03:alert:read_history.
      x-permiso: ms03:alert:read_history
      x-roles:
        - COORDINADOR
        - ORGANIZADOR
        - AUDITOR
      responses:
        '200':
          description: Eventos de auditoria.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEventResponse'
              examples:
                timeline:
                  value:
                    - id: 9b8c7d6e-5f4a-4b3c-8d2e-1f0a9b8c7d6e
                      alertId: 7f3c1a2e-9b4d-4c8a-9f1e-2a6d5c8b7e10
                      actor: 77777777-7777-4777-8777-777777777777
                      actorType: USER
                      action: CREATE
                      fromStatus: null
                      toStatus: DRAFT
                      detail: 'Alert created: title=Sismo en bloque B, type=EARTHQUAKE'
                      occurredAt: '2026-10-22T14:05:00Z'
                    - id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                      alertId: 7f3c1a2e-9b4d-4c8a-9f1e-2a6d5c8b7e10
                      actor: ms06:99999999-9999-4999-8999-999999999999
                      actorType: SERVICE
                      action: END
                      fromStatus: ACTIVE
                      toStatus: ENDED
                      detail: 'Alert ended'
                      occurredAt: '2026-10-22T14:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    AlertId:
      name: id
      in: path
      required: true
      description: Identificador UUID de la alerta.
      schema:
        type: string
        format: uuid
    UserIdHeader:
      name: X-User-Id
      in: header
      required: true
      description: UUID del usuario emisor, inyectado por el API Gateway.
      schema:
        type: string
        format: uuid
    UserRoleHeader:
      name: X-User-Role
      in: header
      required: true
      description: |
        Uno o varios roles oficiales separados por coma. Valores permitidos:
        ESTUDIANTE, PROFESOR, ADMINISTRATIVO, BRIGADISTA, COORDINADOR,
        ORGANIZADOR, ADMIN y AUDITOR.
      schema:
        type: string
        example: COORDINADOR
    ServiceNameHeader:
      name: X-Service-Name
      in: header
      required: false
      description: |
        Origen de servicio. ms06 identifica las llamadas de MS06 y se usa para
        exigir simulationId al finalizar.
      schema:
        type: string
        enum:
          - ms03
          - ms06
    CorrelationIdHeader:
      name: X-Correlation-ID
      in: header
      required: false
      description: |
        UUID v4 de correlacion. Si falta o no es valido, MS03 genera uno nuevo
        y lo devuelve en la respuesta.
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: |
        Datos invalidos. Puede ser VALIDACION, REFERENCIA_INVALIDA,
        PAGINACION_INVALIDA o FECHA_ACTIVACION_INVALIDA.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validation:
              value:
                status: 400
                codigo: VALIDACION
                mensaje: Los datos enviados no son válidos
                errores:
                  - campo: title
                    mensaje: Title is required
                correlation_id: 11111111-1111-4111-8111-111111111111
            reference:
              value:
                status: 400
                codigo: REFERENCIA_INVALIDA
                mensaje: Una o más referencias no existen
                errores:
                  - campo: alcance.ids
                    mensaje: 'La referencia no existe: BLD-999'
                correlation_id: 11111111-1111-4111-8111-111111111111
            pagination:
              value:
                status: 400
                codigo: PAGINACION_INVALIDA
                mensaje: Los parámetros de consulta no son válidos
                errores:
                  - campo: size
                    mensaje: Page size must be between 1 and 100
                correlation_id: 11111111-1111-4111-8111-111111111111
            activationDate:
              value:
                status: 400
                codigo: FECHA_ACTIVACION_INVALIDA
                mensaje: La fecha de activación debe ser futura
                errores: []
                correlation_id: 11111111-1111-4111-8111-111111111111
    Unauthorized:
      description: |
        Faltan las cabeceras de identidad, son invalidas o el rol no pertenece
        a la matriz oficial. El Gateway debe inyectarlas.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorized:
              value:
                status: 401
                codigo: NO_AUTENTICADO
                mensaje: Se requiere autenticación o la identidad no es válida
                errores: []
                correlation_id: 11111111-1111-4111-8111-111111111111
    Forbidden:
      description: |
        El permiso no permite la operacion (PROHIBIDO) o el usuario no es
        destinatario de la alerta (NO_ES_DESTINATARIO).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              value:
                status: 403
                codigo: PROHIBIDO
                mensaje: No tienes permiso para realizar esta operación
                errores: []
                correlation_id: 11111111-1111-4111-8111-111111111111
            notARecipient:
              value:
                status: 403
                codigo: NO_ES_DESTINATARIO
                mensaje: No eres destinatario de esta alerta
                errores: []
                correlation_id: 11111111-1111-4111-8111-111111111111
    NotFound:
      description: La alerta no existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            alertNotFound:
              value:
                status: 404
                codigo: ALERTA_NO_ENCONTRADA
                mensaje: 'No se encontró la alerta con ID: 7f3c1a2e-9b4d-4c8a-9f1e-2a6d5c8b7e10'
                errores: []
                correlation_id: 11111111-1111-4111-8111-111111111111
    Conflict:
      description: |
        Conflicto de estado o de datos: ESTADO_ALERTA_INVALIDO,
        TRANSICION_INVALIDA, ALERTA_NO_ACTIVA, CONFLICTO_SIMULACION,
        SIMULACION_DUPLICADA o MODIFICACION_CONCURRENTE.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidAlertState:
              value:
                status: 409
                codigo: ESTADO_ALERTA_INVALIDO
                mensaje: La alerta está en estado ACTIVE y no permite esta operación
                errores: []
                correlation_id: 11111111-1111-4111-8111-111111111111
            invalidTransition:
              value:
                status: 409
                codigo: TRANSICION_INVALIDA
                mensaje: No se puede cambiar la alerta de ENDED a ACTIVE
                errores: []
                correlation_id: 11111111-1111-4111-8111-111111111111
            simulationMismatch:
              value:
                status: 409
                codigo: CONFLICTO_SIMULACION
                mensaje: La alerta 7f3c1a2e-9b4d-4c8a-9f1e-2a6d5c8b7e10 no corresponde al simulacro 3c1f8e2a-5d7b-4a90-8c3e-1f2a4b6c8d90
                errores: []
                correlation_id: 11111111-1111-4111-8111-111111111111
            duplicateSimulationAlert:
              value:
                status: 409
                codigo: SIMULACION_DUPLICADA
                mensaje: 'Ya existe una alerta viva para el simulacro 3c1f8e2a-5d7b-4a90-8c3e-1f2a4b6c8d90: 7f3c1a2e-9b4d-4c8a-9f1e-2a6d5c8b7e10'
                errores: []
                correlation_id: 11111111-1111-4111-8111-111111111111
            concurrentModification:
              value:
                status: 409
                codigo: MODIFICACION_CONCURRENTE
                mensaje: La alerta fue modificada por otro usuario
                errores: []
                correlation_id: 11111111-1111-4111-8111-111111111111
    ServiceUnavailable:
      description: Un servicio externo (MS01 o MS02) no esta disponible.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unavailable:
              value:
                status: 503
                codigo: SERVICIO_EXTERNO_NO_DISPONIBLE
                mensaje: El servicio MS01 no está disponible. Intenta de nuevo más tarde
                errores: []
                correlation_id: 11111111-1111-4111-8111-111111111111
  schemas:
    AlertStatus:
      type: string
      enum:
        - DRAFT
        - SCHEDULED
        - ACTIVE
        - ENDED
        - ARCHIVED
    AlertType:
      type: string
      enum:
        - EARTHQUAKE
        - SIMULATION
        - FIRE
        - OTHER
    AlertOrigin:
      type: string
      enum:
        - MANUAL
        - SIMULATION
    ScopeType:
      type: string
      enum:
        - CAMPUS
        - BUILDING
        - ZONE
    RecipientType:
      type: string
      enum:
        - USER
        - ROLE
    AuditAction:
      type: string
      enum:
        - CREATE
        - UPDATE
        - SCHEDULE
        - ACTIVATE
        - END
        - ARCHIVE
        - CONFIRM
        - NOTIFICATION_SENT
        - NOTIFICATION_FAILED
        - RECIPIENT_RESOLUTION_FAILED
    ScopeRequest:
      type: object
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/ScopeType'
        ids:
          type: array
          description: Obligatorio y no vacio cuando type es BUILDING o ZONE.
          items:
            type: string
          example:
            - BLD-001
    RecipientRequest:
      type: object
      required:
        - type
        - id
      properties:
        type:
          $ref: '#/components/schemas/RecipientType'
        id:
          type: string
          maxLength: 64
          description: |
            UUID del usuario cuando type es USER. Uno de los 8 roles oficiales
            cuando type es ROLE.
          examples:
            - 11111111-1111-4111-8111-111111111111
            - ESTUDIANTE
    AlertOriginRequest:
      type: object
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/AlertOrigin'
        simulationId:
          type: string
          format: uuid
          description: Obligatorio si type es SIMULATION; prohibido si es MANUAL.
    AlertCreateRequest:
      type: object
      required:
        - type
        - title
        - scope
        - instructions
        - recipients
      properties:
        type:
          $ref: '#/components/schemas/AlertType'
        title:
          type: string
          maxLength: 150
          minLength: 1
          example: Simulacro nacional de evacuacion
        scope:
          $ref: '#/components/schemas/ScopeRequest'
        instructions:
          type: string
          maxLength: 1000
          minLength: 1
          example: Seguir las indicaciones de los brigadistas.
        recipients:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RecipientRequest'
        origin:
          $ref: '#/components/schemas/AlertOriginRequest'
        activationAt:
          type: string
          format: date-time
          description: |
            Si es futura, la alerta nace SCHEDULED. Si es pasada o igual al
            instante actual, responde 400 FECHA_ACTIVACION_INVALIDA.
        activateImmediately:
          type: boolean
          description: |
            Si es true, crea la alerta y la activa en la misma operacion. Se
            acepta el alias activarInmediatamente.
    AlertUpdateRequest:
      type: object
      minProperties: 1
      properties:
        type:
          $ref: '#/components/schemas/AlertType'
        title:
          type: string
          maxLength: 150
          minLength: 1
        scope:
          $ref: '#/components/schemas/ScopeRequest'
        instructions:
          type: string
          maxLength: 1000
          minLength: 1
        recipients:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RecipientRequest'
    AlertScheduleRequest:
      type: object
      required:
        - activationAt
      properties:
        activationAt:
          type: string
          format: date-time
    AlertEndRequest:
      type: object
      properties:
        simulationId:
          type: string
          format: uuid
          description: |
            Obligatorio cuando el actor es MS06 u ORGANIZADOR. Se acepta el
            alias eventId.
    AlertResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/AlertType'
        title:
          type: string
        status:
          $ref: '#/components/schemas/AlertStatus'
        origin:
          $ref: '#/components/schemas/AlertOrigin'
        simulationId:
          type:
            - string
            - 'null'
          format: uuid
        scope:
          $ref: '#/components/schemas/ScopeRequest'
        instructions:
          type: string
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/RecipientRequest'
        createdBy:
          type: string
          description: Actor que creo la alerta (UUID del usuario o actor de servicio).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        activationAt:
          type:
            - string
            - 'null'
          format: date-time
        activatedAt:
          type:
            - string
            - 'null'
          format: date-time
        endedAt:
          type:
            - string
            - 'null'
          format: date-time
        archivedAt:
          type:
            - string
            - 'null'
          format: date-time
    AlertSummaryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/AlertType'
        title:
          type: string
        scope:
          $ref: '#/components/schemas/ScopeRequest'
        status:
          $ref: '#/components/schemas/AlertStatus'
        origin:
          $ref: '#/components/schemas/AlertOrigin'
        simulationId:
          type:
            - string
            - 'null'
          format: uuid
        createdAt:
          type: string
          format: date-time
    PageResponseAlertSummaryResponse:
      type: object
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/AlertSummaryResponse'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        total_elementos:
          type: integer
          format: int64
        total_paginas:
          type: integer
          format: int32
    ConfirmationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        idAlerta:
          type: string
          format: uuid
        usuarioId:
          type: string
          format: uuid
        fechaConfirmacion:
          type: string
          format: date-time
    AuditEventResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        alertId:
          type: string
          format: uuid
        actor:
          type: string
        actorType:
          type: string
          enum:
            - USER
            - SERVICE
            - SYSTEM
        action:
          $ref: '#/components/schemas/AuditAction'
        fromStatus:
          oneOf:
            - $ref: '#/components/schemas/AlertStatus'
            - type: 'null'
        toStatus:
          oneOf:
            - $ref: '#/components/schemas/AlertStatus'
            - type: 'null'
        detail:
          type: string
        occurredAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - codigo
        - mensaje
        - errores
        - correlation_id
      properties:
        status:
          type: integer
          description: Codigo HTTP de la respuesta.
        codigo:
          type: string
          enum:
            - VALIDACION
            - REFERENCIA_INVALIDA
            - PAGINACION_INVALIDA
            - FECHA_ACTIVACION_INVALIDA
            - NO_AUTENTICADO
            - PROHIBIDO
            - NO_ES_DESTINATARIO
            - ALERTA_NO_ENCONTRADA
            - NO_ENCONTRADO
            - METODO_NO_PERMITIDO
            - TIPO_NO_SOPORTADO
            - ESTADO_ALERTA_INVALIDO
            - TRANSICION_INVALIDA
            - ALERTA_NO_ACTIVA
            - CONFLICTO_SIMULACION
            - SIMULACION_DUPLICADA
            - MODIFICACION_CONCURRENTE
            - SERVICIO_EXTERNO_NO_DISPONIBLE
            - ERROR_INTERNO
        mensaje:
          type: string
        errores:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        correlation_id:
          type: string
          format: uuid
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
        - campo
        - mensaje
      properties:
        campo:
          type: string
        mensaje:
          type: string
