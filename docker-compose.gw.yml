# Integracion local MS03 -> API Gateway (feature/integracion) -> MS01.
# Uso: docker compose --env-file .env.gw -f docker-compose.gw.yml up -d --build
# Solo el Gateway publica un puerto (8080). Las bases y los MS quedan en la red interna.
name: campusseguro-ms03-integration

services:
  api-gateway:
    image: ghcr.io/campusseguro-dosw-2026-2/api-gateway:${GW_TAG:-integracion}
    ports:
      - "${GW_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY es obligatoria}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GATEWAY_DOWNSTREAM_TIMEOUT_MS: ${GATEWAY_DOWNSTREAM_TIMEOUT_MS:-15000}
      GATEWAY_ROUTES_0_ID: ms01
      GATEWAY_ROUTES_0_URI: http://ms01-identity-and-access:8081
      GATEWAY_ROUTES_0_PATHS: /api/v1/auth/**,/api/v1/users,/api/v1/users/**,/api/v1/roles
      GATEWAY_ROUTES_1_ID: ms03
      GATEWAY_ROUTES_1_URI: http://ms03-alerts-and-emergencies:8083
      GATEWAY_ROUTES_1_PATHS: ${SQUAD_PATHS:?SQUAD_PATHS es obligatoria}
      GW_SERVICE_KEY_MS01: ${MS01_SERVICE_KEY:-}
      GW_SERVICE_KEY_MS03: ${SQUAD_SERVICE_KEY:?SQUAD_SERVICE_KEY es obligatoria}
    networks:
      - edge
      - internal

  ms03-alerts-and-emergencies:
    build:
      context: .
      dockerfile_inline: |
        FROM maven:3.9.11-eclipse-temurin-21 AS build
        WORKDIR /workspace
        COPY pom.xml .
        COPY src ./src
        RUN mvn -B -q package -DskipTests
        FROM eclipse-temurin:21.0.8_9-jre-noble
        WORKDIR /app
        COPY --from=build /workspace/target/*.jar app.jar
        ENTRYPOINT ["java", "-jar", "/app/app.jar"]
    environment:
      SPRING_PROFILES_ACTIVE: integration
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://ms03-db:5432/${MS03_DB_NAME:-campusseguro_alerts}
      DB_USER: ${MS03_DB_USERNAME:-campusseguro}
      DB_PASSWORD: ${MS03_DB_PASSWORD:?MS03_DB_PASSWORD es obligatoria}
      MS01_URL: http://api-gateway:8080
      MS_SERVICE_KEY: ${SQUAD_SERVICE_KEY:?SQUAD_SERVICE_KEY es obligatoria}
      MS01_TECHNICAL_USER_ID: ${MS01_TECHNICAL_USER_ID:?MS01_TECHNICAL_USER_ID es obligatoria}
      MS01_TECHNICAL_USER_ROLE: AUDITOR
      SPRINGDOC_ENABLED: "false"
      BREVO_API_KEY: ""
      MAIL_HOST: 127.0.0.1
      MAIL_PORT: 2525
      MAIL_FROM: no-reply@campusseguro.local
      MAIL_FROM_NAME: CampusSeguro
      APP_BASE_URL: http://localhost:5173
    depends_on:
      ms03-db:
        condition: service_healthy
      api-gateway:
        condition: service_started
    networks:
      - internal

  ms03-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${MS03_DB_NAME:-campusseguro_alerts}
      POSTGRES_USER: ${MS03_DB_USERNAME:-campusseguro}
      POSTGRES_PASSWORD: ${MS03_DB_PASSWORD:?MS03_DB_PASSWORD es obligatoria}
    volumes:
      - ms03-db-data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  ms01-identity-and-access:
    build:
      context: https://github.com/CampusSeguro-DOSW-2026-2/ms01-identity-and-access.git#${MS01_REF:-develop}
      dockerfile_inline: |
        FROM maven:3.9.11-eclipse-temurin-21 AS build
        WORKDIR /workspace
        COPY pom.xml .
        COPY src ./src
        RUN mvn -B -q package -DskipTests
        FROM eclipse-temurin:21.0.8_9-jre-noble
        WORKDIR /app
        COPY --from=build /workspace/target/*.jar app.jar
        ENTRYPOINT ["java", "-jar", "/app/app.jar"]
    environment:
      DB_URL: jdbc:postgresql://ms01-db:5432/${MS01_DB_NAME:-campus_db}
      DB_USERNAME: ${MS01_DB_USERNAME:-campus_user}
      DB_PASSWORD: ${MS01_DB_PASSWORD:?MS01_DB_PASSWORD es obligatoria}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY es obligatoria}
      GATEWAY_URL: http://api-gateway:8080
      GATEWAY_SERVICE_KEY: ${MS01_SERVICE_KEY:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_FIRST_NAME: ${BOOTSTRAP_ADMIN_FIRST_NAME:-}
      BOOTSTRAP_ADMIN_LAST_NAME: ${BOOTSTRAP_ADMIN_LAST_NAME:-}
      SWAGGER_ENABLED: "false"
    depends_on:
      ms01-db:
        condition: service_healthy
    networks:
      - internal

  ms01-db:
    build:
      context: https://github.com/CampusSeguro-DOSW-2026-2/ms01-identity-and-access.git#${MS01_REF:-develop}
      dockerfile_inline: |
        FROM postgres:17-alpine
        COPY database /docker-entrypoint-initdb.d/
    environment:
      POSTGRES_DB: ${MS01_DB_NAME:-campus_db}
      POSTGRES_USER: ${MS01_DB_USERNAME:-campus_user}
      POSTGRES_PASSWORD: ${MS01_DB_PASSWORD:?MS01_DB_PASSWORD es obligatoria}
    volumes:
      - ms01-db-data:/var/lib/postgresql/data
      - ./integration/ms01-seed.sql:/docker-entrypoint-initdb.d/99_ms01_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

networks:
  edge: {}
  internal:
    internal: true

volumes:
  ms01-db-data: {}
  ms03-db-data: {}
